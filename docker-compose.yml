version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: grandnode_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  grandnode:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: grandnode_web
    ports:
      - "8080:8080"
    environment:
      - ConnectionStrings__Mongodb=mongodb://mongodb:27017/GrandNode
      - FeatureManagement__Grand.Module.Installer=false
      # Możesz odkomentować poniższe, jeśli korzystasz z Redis lub chcesz wymusić URL
      # - ASPNETCORE_URLS=http://+:8080
      # - Redis__RedisPubSubEnabled=true
      # - Redis__RedisPubSubConnectionString=redis:6379,allowAdmin=true
    depends_on:
      - mongodb
    restart: unless-stopped

# Opcjonalnie Redis, jeśli włączony powyżej
#  redis:
#    image: redis:latest
#    container_name: grandnode_redis
#    ports:
#      - "6379:6379"
#    restart: unless-stopped

volumes:
  mongodb_data:
